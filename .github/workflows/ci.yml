name: CI

on:
  pull_request:
    branches: [develop, main]
  # main is included so its state is never unverified between releases. It was
  # left failing check_deps_sync for days because CI only ran on develop, and a
  # push to main (the release merge) triggered nothing.
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -m "not live" -q
